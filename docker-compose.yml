# Temporal dev stack — single container, SQLite-backed, UI included.
#   gRPC    localhost:7233
#   web UI  http://localhost:8233
#
# Uses the `temporal server start-dev` CLI rather than the auto-setup image:
# auto-setup only supports mysql/postgres/cassandra and exits on DB=sqlite.
#
# Storage is EPHEMERAL — state is lost on `docker compose down`. That is fine
# for dev and deliberate: the audit-trail retention this application actually
# needs is an unresolved question, not a docker default (PRD.md §10 Q1).

services:
  temporal:
    image: temporalio/temporal:1.5.0
    container_name: wf-temporal
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --port=7233
      - --ui-port=8233
      - --namespace=default
      - --log-level=warn
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
